<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		html,body{
			background-color: #0D0D0D;
			height: 100%;
			margin: 0;
			position: relative;
			overflow: hidden;
		}
		.box{
			width: 40px;
			height: 40px;
			border-radius: 50%;
			border: 3px solid yellow;
			position: absolute;
			transition: cubic-bezier(0.19, 1, 0.22, 1) 0.2s;
		}
		.box::before{
			content: ".";
			position: absolute;
			width: 5px;
			height: 5px;
			top: 50%;
			left: 50%;
			background-color: white;
			border-radius: 50%;
			transition: cubic-bezier(0.19, 1, 0.22, 1) 0.3s;
		}
		
	</style>
</head>
<body>
	<div class="box"></div>

	<script src="js/script.js"></script>
</body>
</html>
