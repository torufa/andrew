<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		.hide{
			display: none;
			color: red;
		}
	</style>
</head>
<body>
	<form style="display: inline-grid">
		<input required pattern="[A-Ba-c]{3,4}" type="text">
		<div class="check hide">
			<p>more than 2 words</p>
		</div>
		<input type="email" placeholder="write your email">
		<input required minlength="4" maxlength="16" type="password" placeholder="write your password">
		<select>
			<option>one</option>
			<option>two</option>
			<option>three</option>
		</select>
		<input type="textarea">
		<button type="submit">submit</button>
	</form>

	<script src="js/script.js"></script>
</body>
</html>
