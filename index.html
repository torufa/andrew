<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		html,body{
			background-color: #0D0D0D;
			height: 100%;
			margin: 0;
		}
		form{			
			padding: 50px;
		}
		input{
			display: block;
			font-family: "monospace";
			font-size: 25px;
			padding: 10px 20px;
			background-color: #00C8FF;
			color: #fff;
			border: 0px;
			margin: 10px;
			border-radius: 20px;
		}
		input::placeholder{
			color: #fff;
		}
		.btn{
			background-color: #009ADE;
			margin-top: 30px;
		}

		.dtls{
			display: flex;
			flex-wrap: wrap;
		}
		.card{
			width: 300px;
			padding: 20px;
			color: white;
			text-align: center;
			box-shadow: 1px 1px 16px -6px rgb(179 222 230 / 20%);
			margin: 50px;
			border-radius: 18px;
			font-size: 20px;
			background: #111;
		}
		.profile{
			width: 100px;
			height: 100px;
			margin: auto;
		}
		img{
			width: 100%;
			height: 100%;
			object-fit: cover;
			border-radius: 50px;
		}
		
	</style>
</head>
<body>
	<form>
		<input type="text" placeholder="Profile Picture">
		<input type="text" placeholder="Name">
		<input type="text" placeholder="Designation">
		<input type="text" placeholder="about">
		<input type="submit" class="btn" placeholder="Submit">
	</form>

	<script src="js/script.js"></script>
</body>
</html>
